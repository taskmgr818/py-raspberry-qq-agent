app:
  timezone: Asia/Shanghai
  data_dir: ./data
  knowledge_dir: ./knowledge
  notebook_dir: ./notebooks

logging:
  level: INFO
  file: ./logs/agent.log
  max_bytes: 10000000
  backup_count: 5
  json: ${LOG_JSON:-false}

llm:
  main:
    base_url: ${LLM_BASE_URL:-https://api.openai.com/v1}
    api_key: ${LLM_API_KEY}
    model: ${LLM_MODEL:-gpt-4.1-mini}
    temperature: 0.3
    max_tokens: 4096
    timeout_seconds: 120
    retry_count: 2
    # Provider-specific reasoning switch. Examples:
    # OpenAI-compatible: {reasoning_effort: medium}
    # DeepSeek-compatible: {thinking: {type: enabled}}
    extra_body: {}
  classifier:
    base_url: ${CLASSIFIER_BASE_URL:-https://api.openai.com/v1}
    api_key: ${CLASSIFIER_API_KEY:-}
    model: ${CLASSIFIER_MODEL:-gpt-4.1-nano}
    temperature: 0
    max_tokens: 300
    timeout_seconds: 30
    retry_count: 1
    extra_body: {}
  max_tool_rounds: 12
  tool_timeout_seconds: 120
  prompt:
    # Empty means use the built-in policy prompt.
    system: ""
    time_tool: true

napcat:
  ws_url: ${NAPCAT_WS_URL:-ws://127.0.0.1:3001}
  access_token: ${NAPCAT_ACCESS_TOKEN:-}
  # Enable private messages to non-friends through a verified common group.
  allow_temp_session: false
  # Fixed TTL shared by friend, group and per-group member caches.
  cache_ttl_seconds: 7200
  reconnect_seconds: 5
  request_timeout_seconds: 30

security:
  # QQs listed here are granted admin on every startup. Prefer:
  # uv run py-raspberry-qq-agent --config config.yaml admin add --qq 123456
  admin_qq_ids: []

message_gate:
  private_enabled: true
  group_mention_enabled: true
  allowlist:
    # When enabled, only these private chats and groups may trigger or receive
    # model-initiated messages, including scheduled Agent tasks. Program-selected
    # assignment/due notifications and history reads are not restricted by this list.
    enabled: false
    private_qq_ids: []
    group_ids: []
  classifier_fail_closed: true
  classifier_min_confidence: 0.65
  classifier_context_messages: 12
  classifier_message_chars: 4000
  classifier_context_chars: 1200
  outbound_queue_size: 256
  outbound_min_interval_seconds: 2
  outbound_max_interval_seconds: 4
  outbound_send_timeout_seconds: 30

group_digest:
  enabled: false
  # Group IDs are used internally; model inputs receive opaque references.
  groups: []
  interval_minutes: 60
  initial_lookback_minutes: 60
  min_messages: 1
  prompt: "整理这段时间内有价值的群聊讨论，忽略寒暄、重复和灌水。"
  # Optional explicit MCP tool; empty saves Markdown locally only.
  upload_tool: ""

scheduler:
  enabled: true
  tick_seconds: 1

history:
  limit: 80
  max_fetch: 500
  content_chars: 12000
  dedupe_messages: 2000

directory:
  default_page_size: 50
  max_page_size: 200

knowledge:
  max_file_bytes: 2000000
  max_search_results: 50
  max_read_lines: 400

mcp:
  enabled: ${MCP_ENABLED:-false}
  upload:
    endpoint: ${MCP_UPLOAD_ENDPOINT:-}
    api_token: ${MCP_UPLOAD_API_TOKEN:-}
    timeout_seconds: 60
    headers: {}
  servers:
    items:
      - name: upload
        transport: stdio
        command: uv
        args:
          - run
          - qq-agent-upload-mcp
          - --config
          - config.yaml
        allowed_tools:
          - upload_markdown

keycloak:
  issuer: ${OIDC_ISSUER:-}
  admin_url: ${KEYCLOAK_ADMIN_URL:-}
  client_id: ${BOT_KEYCLOAK_CLIENT_ID:-}
  client_secret: ${BOT_KEYCLOAK_CLIENT_SECRET:-}
  qq_attribute: qq_number

guild:
  enabled: false
  database_url: ${GUILD_DATABASE_URL:-}
  public_url: ${GUILD_PUBLIC_URL:-}
  poll_seconds: 60
  due_reminder:
    enabled: true
    advance_hours: 24
  assignments:
    enabled: true
  weekly_report:
    enabled: true
    # UTC+8. Empty means no automatic run until a time is chosen.
    # Example: {kind: weekly, weekdays: [mon], time: "09:00"}
    schedule: {}
    directory: guild-reports
    prompt: "总结任务进展、协作讨论、未完成事项和需要关注的问题。"
    upload_tool: ""
