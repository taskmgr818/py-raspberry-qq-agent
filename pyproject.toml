[project]
name = "py-raspberry-qq-agent"
version = "0.1.0"
description = "A policy-aware QQ assistant with in-memory tasks, scheduling, knowledge, and MCP tools"
readme = "README.md"
authors = [
    { name = "SiliconSiliconGrass", email = "indexguo@163.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bitnp-authz @ https://git.bitnp.net/BITNP/bitnp-authz/archive/643da5d210aacfd18643862ffdc3e5ef442b63f7.tar.gz#subdirectory=python",
    "httpx>=0.27,<1",
    "mcp>=1.9,<2",
    "psycopg[binary]>=3.2,<4",
    "pyyaml>=6.0,<7",
    "tzdata>=2025.2",
    "websockets>=13,<16",
]

[project.scripts]
py-raspberry-qq-agent = "py_raspberry_qq_agent.cli:main"
qq-agent-upload-mcp = "py_raspberry_qq_agent.upload_mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
